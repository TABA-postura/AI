name: CI/CD Pipeline

on:
  push:
    branches:
      - main  # main 브랜치에 푸시될 때마다 트리거됩니다.

jobs:
  build:
    runs-on: ubuntu-latest  # GitHub에서 제공하는 최신 우분투 환경에서 실행

    steps:
      # 1. 코드 체크아웃 (리포지토리에서 코드 가져오기)
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # 자동 인증을 위한 GitHub Token 사용

      # 2. Docker 빌드 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      # 3. DockerHub에 로그인
      - name: Log in to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}  # GitHub Secrets에서 DockerHub 사용자 이름
          password: ${{ secrets.DOCKER_PASSWORD }}  # GitHub Secrets에서 DockerHub 비밀번호

      # 4. Docker 이미지를 빌드하고, Docker Hub에 푸시
      - name: Build and push Docker image
        run: |
          docker build -t yejin1029/postura-ai:latest .  # 실제 Docker Hub 사용자명과 이미지 이름
          docker push yejin1029/postura-ai:latest     # 동일하게 푸시

      # 5. EC2 서버에 배포
      - name: SSH to EC2 and deploy
        uses: appleboy/ssh-action@v0.1.1
        with:
          host: ${{ secrets.EC2_HOST }}  # EC2 서버의 IP
          username: ${{ secrets.EC2_USER }}  # EC2 사용자 (보통 'ubuntu')
          key: ${{ secrets.EC2_SSH_KEY }}  # EC2 SSH 키 (GitHub Secrets에서 비공개 키 저장)
          script: |
            docker pull your-dockerhub-username/your-image-name
            docker stop your-container-name || true  # 기존 컨테이너 종료
            docker rm your-container-name || true    # 기존 컨테이너 삭제
            docker run -d --name your-container-name -p 80:80 your-dockerhub-username/your-image-name
